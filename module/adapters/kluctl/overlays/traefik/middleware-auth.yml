{% if get_var('overlays.middleware_auth', false) %}
---
apiVersion: v1
kind: Secret
metadata:
  name: traefik-forward-auth
  namespace: {{ overlays.middleware_auth.namespace | default("sys") }}
stringData:
  AUTH_HOST: {{ overlays.middleware_auth.auth_host | default("auth." ~ args.domain) }}
  COOKIE_DOMAIN: {{ args.domain }}
  SECRET: {{ secrets.traefik.forwardauth.secret }}
  DEFAULT_PROVIDER: {{ overlays.middleware_auth.provider | default("oidc") }}
  PROVIDERS_OIDC_ISSUER_URL: {{ overlays.middleware_auth.oidc.issuer_url }}
  PROVIDERS_OIDC_CLIENT_ID: {{ secrets.traefik.forwardauth.oidc.client_id }}
  PROVIDERS_OIDC_CLIENT_SECRET: {{ secrets.traefik.forwardauth.oidc.client_secret }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-forward-auth
  namespace: {{ overlays.middleware_auth.namespace | default("sys") }}
  labels:
    app.kubernetes.io/name: traefik-forward-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik-forward-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik-forward-auth
    spec:
      containers:
      - name: traefik-forward-auth
        image: thomseddon/traefik-forward-auth:2
        ports:
        - containerPort: 4181
        envFrom:
        - secretRef:
            name: traefik-forward-auth
        env:
        - name: LOG_LEVEL
          value: {{ overlays.middleware_auth.log_level | default("info") }}
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-forward-auth
  namespace: {{ overlays.middleware_auth.namespace | default("sys") }}
  labels:
    app.kubernetes.io/name: traefik-forward-auth
spec:
  selector:
    app.kubernetes.io/name: traefik-forward-auth
  ports:
  - port: 4181
    targetPort: 4181
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-forward
  namespace: {{ overlays.middleware_auth.namespace | default("sys") }}
spec:
  forwardAuth:
    address: http://traefik-forward-auth.{{ overlays.middleware_auth.namespace | default("sys") }}.svc.cluster.local:4181
    trustForwardHeader: true
    authResponseHeaders:
    - X-Forwarded-User
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-forward-auth
  namespace: {{ overlays.middleware_auth.namespace | default("sys") }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    hajimari.io/enable: "false"
spec:
  ingressClassName: traefik
  rules:
  - host: {{ overlays.middleware_auth.auth_host | default("auth." ~ args.domain) }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: traefik-forward-auth
            port:
              number: 4181
  tls:
  - hosts:
    - {{ overlays.middleware_auth.auth_host | default("auth." ~ args.domain) }}
{% endif %}
