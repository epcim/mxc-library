{% if get_var('secrets.authelia', none) %}
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-secrets
stringData:
  JWT_SECRET: "{{ secrets.authelia.jwt_secret }}"
  SESSION_SECRET: "{{ secrets.authelia.session_secret }}"
  STORAGE_ENCRYPTION_KEY: "{{ secrets.authelia.storage_encryption_key }}"
  OIDC_HMAC_SECRET: "{{ secrets.authelia.jwt_secret }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
data:
  configuration.yml: |
    theme: auto
    default_2fa_method: webauthn
    
    server:
      address: tcp://0.0.0.0:9091/
    
    log:
      level: info
      format: text
    
    totp:
      disable: false
      issuer: {{ args.domain }}
    
    webauthn:
      disable: false
      display_name: Authelia
      attestation_conveyance_preference: indirect
      user_verification: preferred
      timeout: 60s
    
    authentication_backend:
      file:
        path: /config/users.yml
        password:
          algorithm: argon2id
    
    session:
      name: authelia_session
      same_site: lax
      inactivity: 5m
      expiration: 1h
      remember_me: 1M
      cookies:
        - domain: {{ args.domain }}
          authelia_url: https://sso.{{ args.domain }}
          default_redirection_url: https://portal.{{ args.domain }}
    
    storage:
      local:
        path: /data/db.sqlite3
    
    notifier:
      disable_startup_check: true
      filesystem:
        filename: /data/notifications.txt
    
    access_control:
      default_policy: deny
      rules:
        - domain: sso.{{ args.domain }}
          policy: bypass
        - domain: "*.{{ args.domain }}"
          policy: two_factor
{% if get_var('secrets.authelia.oidc.clients', none) %}
    
    identity_providers:
      oidc:
        jwks:
          - key: |
              {{ secrets.authelia.oidc_private_key | replace('\\n', '\n') | indent(14) }}
        clients:
{% for client_id, client in secrets.authelia.oidc.clients.items() %}
          - client_id: {{ client.client_id }}
            client_name: {{ client.client_name }}
            client_secret: {{ client.client_secret }}
            authorization_policy: {{ client.authorization_policy | default('two_factor') }}
            redirect_uris:
{% for uri in client.redirect_uris %}
              - {{ uri }}
{% endfor %}
            scopes:
{% for scope in client.scopes | default(['openid', 'profile', 'email', 'groups']) %}
              - {{ scope }}
{% endfor %}
            token_endpoint_auth_method: {{ client.token_endpoint_auth_method | default('client_secret_post') }}
{% endfor %}
{% endif %}
  
  users.yml: |
    users:
{% for username, user in secrets.authelia.users.items() %}
      {{ username }}:
        displayname: {{ user.displayname | default(username) }}
        password: {{ user.password_hash }}
        email: {{ user.email | default(username ~ '@' ~ args.domain) }}
        groups:
{% for group in user.groups | default(['users']) %}
          - {{ group }}
{% endfor %}
{% endfor %}
{% endif %}
